name: Build TheSpoiledSeed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip gradle-2.14.1-bin.zip
          echo "$PWD/gradle-2.14.1/bin" >> $GITHUB_PATH

      - name: Extract ZIP
        run: |
          unzip -o TheSpoiledSeed-v0.1.1-source.zip -d source

      - name: Fix old Forge repository
        run: |
          sed -i 's|http://files.minecraftforge.net/maven|https://files.minecraftforge.net/maven|g' source/TheSpoiledSeed/build.gradle

      - name: Fix LayerNullEyes
        run: |
          sed -i '/setupFogColor/d' source/TheSpoiledSeed/src/main/java/com/spoiledseed/client/LayerNullEyes.java

      - name: Build mod
        working-directory: source/TheSpoiledSeed
        run: gradle build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TheSpoiledSeed-JAR
          path: source/TheSpoiledSeed/build/libs/*.jar
